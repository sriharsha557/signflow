# nginx in front of SignFlow (non-Docker install). Get a certificate with:
#   sudo apt install nginx certbot python3-certbot-nginx && sudo certbot --nginx -d sign.example.com
server {
  listen 80;
  server_name sign.example.com;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2;
  server_name sign.example.com;
  # ssl_certificate / ssl_certificate_key lines are added by certbot
  client_max_body_size 30m;
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
